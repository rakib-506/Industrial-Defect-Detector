

services:
  - type: web
    name: defect-detector
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon


    healthCheckPath: /health

    envVars:
      - key: DEFECT_DETECTOR_DEVICE
        value: cpu
     
      - key: DEFECT_DETECTOR_MAX_CACHED_BANKS
        value: "1"

      - key: PYTHONUNBUFFERED
        value: "1"
 
      - key: HF_HOME
        value: /home/appuser/.cache/huggingface
      - key: TORCH_HOME
        value: /home/appuser/.cache/torch

    autoDeploy: false



